# Pass 1: speech and requested captions only. This is not the final video.
# After completion, edit the returned recipeYaml, not this unresolved input.
document:
  version: 2
  mode: assemble
  instanceId: narrated-documentary
  before:
    - id: childhood-voice
      type: speech.generate
      language: ro
      model: google/gemini-3.8-flash-tts
      voice: Kore
      instructions: Calm documentary narration with native Romanian pronunciation.
      text: >-
        Codrul și lacul inspiră poezia. Lumina lunii completează peisajul.
  placements:
    - job: childhood-voice
      track: {type: audio, role: narration}
      start: 0s
  after:
    - id: captions-ro
      type: captions.generate
      language: ro
      maxWords: 4
      style:
        fontFamily: montserrat
        fontSize: 48
        x: 960
        y: 925
        anchor: center
        align: center
        color: '#FFFFFF'
        strokeColor: '#10151C'
        strokeWidth: 2
        highlightMode: word
        highlightAnimation: none
  output:
    aspect: landscape
    resolution: 1080p
    fps: 30
    format: mp4
bindings: {}
assets: []
