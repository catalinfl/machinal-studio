# Pending, paid scene job: fetching or compiling this example executes nothing.
document:
  version: 2
  mode: assemble
  before:
    - id: process-opener
      type: scene.generate
      duration: 6s
      width: 1080
      height: 1920
      fps: 30
      visualMode: 2d
      prompt: >-
        A six-second portrait editorial process explanation, not a title card.
        Exact labels: Prepare, Demonstrate, Review. Use a warm ivory background,
        cobalt primary objects, charcoal type and one amber active-state accent.
        Compose three vertically aligned stations in the upper 72% of the frame,
        with a subtle background grid, a continuous route behind the stations
        and distinct foreground icons: organized tools, a demonstration stage,
        and a review check. Draw deliberate geometric SVG objects, not generic
        cards. Local 0-0.7s: reveal the route and first subject. 0.7-2.8s:
        a marker travels the route and each station changes independently as
        it arrives; reveal the matching label beside its object, never on top.
        2.8-5.3s: keep all subjects and labels fully visible for the reading hold,
        with only restrained marker motion. 5.3-6s: settle and dim the route,
        retaining readable subjects rather than fading the whole scene early.
        Derive SVG stroke reveal, marker position, transforms and opacity from
        frame time with separate clamped entrance/exit. Maintain safe margins,
        visible contrast and a reserved bottom caption band. No invented data,
        external assets, production labels, disclaimers or watermarks.
  placements:
    - {job: process-opener, track: {type: video, role: opener}, start: 0s, duration: 6s}
  output: {aspect: portrait, resolution: 1080p, fps: 30, format: mp4}
bindings: {}
assets: []
