# Example title copy is supplied content, not an invented transcript.
document:
  version: 2
  mode: assemble
  tracks:
    - id: main
      type: video
      clips:
        - {id: first, assetId: shot-a, start: 0s, inPoint: 0s, outPoint: 3s}
        - {id: second, assetId: shot-b, start: 2.7s, inPoint: 0s, outPoint: 3s}
  transitions:
    - {id: first-to-second, trackId: main, leftClipId: first, rightClipId: second, preset: whip-pan-left, duration: 300ms}
  rules:
    - id: base-look
      target: {kind: video, trackId: main}
      apply: {look: clean-social-pop}
    - id: opening-emphasis
      target: {kind: video, ids: [first]}
      apply: {motion: punch}
  texts:
    - {id: hook, text: 'A simpler way to begin', start: 0s, duration: 2s, preset: social-hook, x: 540, y: 350}
  output: {aspect: portrait, resolution: 1080p, fps: 30, format: mp4}
bindings: {}
assets:
  - {id: shot-a, file: shot-a.mp4, version: example-only, kind: video, duration: 8s, width: 1080, height: 1920}
  - {id: shot-b, file: shot-b.mp4, version: example-only, kind: video, duration: 8s, width: 1080, height: 1920}
