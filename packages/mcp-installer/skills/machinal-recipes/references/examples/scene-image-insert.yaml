# Synthetic mixed edit: inspect/replace both source files before real use.
# Pure compilation reports one pending scene; it never calls a paid provider.
document:
  version: 2
  mode: assemble
  tracks:
    - id: footage
      type: video
      clips:
        - {id: opening, assetId: demonstration, start: 0s, inPoint: 0s, outPoint: 4s}
        - {id: return, assetId: demonstration, start: 10s, inPoint: 4s, outPoint: 10s}
  before:
    - id: moving-explainer
      type: scene.generate
      duration: 6s
      width: 1920
      height: 1080
      fps: 30
      images:
        - id: image_1
          file: supplied-product.png
          name: Supplied product image
          description: Use the original image inside the central card; preserve proportions and existing alpha.
      prompt: >-
        Create an animated Svelte explainer, not a static image with a camera zoom.
        Use image_1 inside a central product card with a quiet cobalt/white background
        and safe margins. Exact supplied labels are Prepare, Connect, Ready.
        Scene-local 0-1s: bring the card in from the left and settle it at center.
        At 1-3s, move two procedural circles independently along short paths toward
        the card, draw connecting arrows and reveal the first two labels in order.
        Keep labels attached to their related objects. At 3-5s, reveal Ready and
        hold the completed diagram for reading. At 5-6s, settle the surrounding
        objects without hiding the product. Derive animation from the scene runtime.
        Preserve the supplied image; no invented numbers, logos, claims or external media.
  placements:
    - {job: moving-explainer, track: {type: video, role: explanation}, start: 4s, duration: 6s}
  output: {aspect: landscape, resolution: 1080p, fps: 30, format: mp4}
bindings: {}
assets:
  - {id: demonstration, file: demonstration.mp4, version: example-only, kind: video, duration: 10s, width: 1920, height: 1080}
  - {id: product, file: supplied-product.png, version: example-only, kind: image, width: 1000, height: 1000}
