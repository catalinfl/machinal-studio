document:
  version: 2
  mode: assemble
  inputs:
    demo: {kind: video}
  sequence:
    use: demo
    each:
      take: {from: 0s, duration: 6s}
      source_audio: keep
      look: clean-tutorial
      motion: none
  texts:
    - {id: step-one, text: '01 / Prepare the ingredients', start: 0s, duration: 3s, preset: step-label, x: 400, y: 220}
  output: {aspect: landscape, resolution: 1080p, fps: 30, format: mp4}
bindings:
  demo: [demo]
assets:
  - {id: demo, file: demonstration.mp4, version: example-only, kind: video, duration: 8s, width: 1920, height: 1080, hasAudio: true}
