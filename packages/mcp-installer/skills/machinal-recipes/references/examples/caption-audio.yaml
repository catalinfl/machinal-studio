# Synthetic verified-word fixture; real captions need measured/supplied timings.
document:
  version: 2
  mode: assemble
  inputs:
    demo: {kind: video}
    music: {kind: audio}
  sequence:
    use: demo
    each: {take: {from: 0s, duration: 6s}, source_audio: keep}
  audio:
    - {id: music-bed, use: music, start: 0s, from: 0s, fit: sequence, repeat: true, volume: 18}
  texts:
    - id: spoken-phrase
      text: 'Hello world'
      start: 1s
      duration: 1200ms
      preset: active-word
      words:
        - {text: Hello, start: 0s, end: 500ms}
        - {text: world, start: 500ms, end: 1200ms}
  output: {aspect: portrait, resolution: 1080p, fps: 30, format: mp4}
bindings:
  demo: [demo]
  music: [bed]
assets:
  - {id: demo, file: demonstration.mp4, version: example-only, kind: video, duration: 8s, width: 1080, height: 1920, hasAudio: true}
  - {id: bed, file: licensed-music.mp3, version: example-only, kind: audio, duration: 4s, hasAudio: true}
