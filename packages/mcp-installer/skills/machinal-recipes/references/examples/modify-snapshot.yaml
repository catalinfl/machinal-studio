# A real request must use a current compiler snapshot, never this fixture revision.
document:
  version: 3
  mode: modify
  commands:
    - {type: clip.trim, target: {kind: video, ids: [clip-a]}, patch: {from: 1s, duration: 4s}}
    - {type: motion.apply, target: {kind: video, ids: [clip-a]}, preset: settle}
  output: {aspect: landscape, resolution: 1080p, fps: 30, format: mp4}
bindings: {}
assets:
  - {id: a, file: source-a.mp4, version: example-only, kind: video, duration: 8s, width: 1920, height: 1080}
snapshot:
  revision: synthetic-snapshot-only
  tracks:
    - id: main
      type: video
      clips:
        - {id: clip-a, assetId: a, start: 0s, inPoint: 0s, outPoint: 6s}
  effects: []
  transitions: []
  textItems: []
  selectedIds: [clip-a]
