# Pass 2, after narration-timing completes. All resolved audio/caption values
# below are synthetic test fixtures, NOT real output to copy into a project.
# Use the actual returned recipeYaml/assets/word times. Only visuals are pending.
document:
  version: 2
  mode: assemble
  instanceId: narrated-documentary
  before:
    - id: woodland-art
      type: image.generate
      aspect: 16:9
      prompt: >-
        A restrained poetic woodland and calm lake in blue-green evening light.
        An illustrative landscape, not a literal historical reconstruction.
        Leave the upper quarter and bottom 24 percent clear of important detail.
        No lettering.
    - id: childhood-scene
      type: scene.generate
      narrationJob: childhood-voice
      narrationFrom: 4.6s
      duration: 3.8s
      visualMode: 3d
      images:
        - {id: image_1, job: woodland-art, name: Woodland and lake}
      prompt: >-
        Illustrate only the measured excerpt about moonlight completing the
        landscape. Use genuine SceneThree: keep image_1 visible on a textured
        woodland plane and reveal a softly lit moon mesh above the lake as
        Lumina lunii is spoken. Follow the supplied scene-local narration cues,
        not invented word times. Drift the camera gently, hold the complete
        scene through the remaining phrase, and settle without hiding the art.
        Reserve the bottom 24 percent for captions. No on-screen copy.
  # Materialized jobs are retained from pass 1; do not recreate pending speech.
  jobs:
    - id: childhood-voice
      type: speech.generate
      language: ro
      text: >-
        Codrul și lacul inspiră poezia. Lumina lunii completează peisajul.
      resultAssetId: example-voice
    - id: captions-ro
      type: captions.generate
      language: ro
      maxWords: 4
      resultTextIds: [captions-ro/caption/0, captions-ro/caption/1, captions-ro/caption/2]
  tracks:
    - id: recipe/audio/narration
      type: audio
      name: narration
      clips:
        - {id: example-voice-clip, assetId: example-voice, start: 0s, inPoint: 0s, outPoint: 8.4s, playbackRate: 1, volume: 100}
  placements:
    - job: woodland-art
      track: {type: video, role: main}
      start: 0s
      duration: 4.6s
    - job: childhood-scene
      track: {type: video, role: main}
      start: 4.6s
      duration: 3.8s
  texts:
    - id: chapter-heading
      text: Copilăria la Ipotești
      start: 0s
      duration: 4s
      anchor: left
      align: left
      x: 150
      y: 64
      fontFamily: montserrat
      fontSize: 24
      color: '#FFFFFF'
      strokeColor: '#10151C'
      strokeWidth: 1
    - id: captions-ro/caption/0
      text: Codrul și lacul inspiră
      start: 0.2s
      duration: 2.2s
      isCaption: true
      highlightMode: word
      words:
        - {text: Codrul, start: 0s, end: 0.5s}
        - {text: și, start: 0.6s, end: 0.8s}
        - {text: lacul, start: 0.9s, end: 1.4s}
        - {text: inspiră, start: 1.5s, end: 2.2s}
    - id: captions-ro/caption/1
      text: poezia.
      start: 2.8s
      duration: 0.8s
      isCaption: true
      highlightMode: word
      words:
        - {text: poezia., start: 0s, end: 0.8s}
    - id: captions-ro/caption/2
      text: Lumina lunii completează peisajul.
      start: 4.8s
      duration: 3.3s
      isCaption: true
      highlightMode: word
      words:
        - {text: Lumina, start: 0s, end: 0.6s}
        - {text: lunii, start: 0.7s, end: 1.3s}
        - {text: completează, start: 1.5s, end: 2.3s}
        - {text: peisajul., start: 2.5s, end: 3.3s}
  output:
    aspect: landscape
    resolution: 1080p
    fps: 30
    format: mp4
bindings: {}
assets:
  - {id: example-voice, file: example-voice.wav, kind: audio, version: synthetic-timing-fixture, duration: 8.4s, hasAudio: true}
